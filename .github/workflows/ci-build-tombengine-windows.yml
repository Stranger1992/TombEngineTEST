name: CI Build Tomb Engine (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet tool
        uses: NuGet/setup-nuget@v1

      - name: Diagnose Visual Studio installations
        shell: pwsh
        run: |
          Write-Host "vswhere (MSBuild-capable installations):"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -requires Microsoft.Component.MSBuild -property installationPath

      - name: Find solution and prepare packages
        id: find_and_prepare
        shell: pwsh
        run: |
          Write-Host "Locating a .sln file in the repository..."
          $sln = Get-ChildItem -Path . -Recurse -Filter *.sln -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sln) {
            Write-Host "No .sln file found in repository. Aborting."
            exit 1
          }

          # Resolve to absolute path and compute relative path from repo root
          $slnFull = (Resolve-Path $sln.FullName).Path
          $repoRoot = (Get-Location).Path
          $slnRelative = $slnFull.Substring($repoRoot.Length + 1)
          Write-Host "Found solution (relative): $slnRelative"
          Write-Host "Found solution (absolute): $slnFull"

          # Compute solution directory robustly
          $slnDir = Split-Path -Path $slnFull -Parent
          if ([string]::IsNullOrWhiteSpace($slnDir)) {
            $slnDir = $repoRoot
            Write-Host "Solution parent was empty; using repo root as solution directory: $slnDir"
          } else {
            Write-Host "Solution directory: $slnDir"
          }

          # Export outputs for later steps
          Write-Output "solutionPath=$slnRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "solutionDir=$slnDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Ensure packages folder exists and check for Microsoft.XAudio2.Redist
          $packagesDir = Join-Path $slnDir "packages"
          Write-Host "Expected packages folder: $packagesDir"
          $pkgPattern = Join-Path $packagesDir "Microsoft.XAudio2.Redist.*"

          if (-not (Test-Path $packagesDir) -or -not (Get-ChildItem -Path $pkgPattern -ErrorAction SilentlyContinue)) {
            Write-Host "Microsoft.XAudio2.Redist not found; installing into solution packages folder..."
            $tempOut = Join-Path $PWD "nuget_temp_packages"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $tempOut
            New-Item -ItemType Directory -Path $tempOut | Out-Null
            nuget install Microsoft.XAudio2.Redist -Version 1.2.10 -OutputDirectory $tempOut -NonInteractive
            if ($LASTEXITCODE -ne 0) {
              Write-Host "nuget install returned exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            New-Item -ItemType Directory -Path $packagesDir -Force | Out-Null
            Get-ChildItem -Path $tempOut -Directory | ForEach-Object {
              $dest = Join-Path $packagesDir $_.Name
              if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
              Move-Item -Path $_.FullName -Destination $dest
            }
            Remove-Item -Recurse -Force $tempOut
            Write-Host "Microsoft.XAudio2.Redist installed into $packagesDir"
          } else {
            Write-Host "Microsoft.XAudio2.Redist already present under $packagesDir"
          }

      - name: Restore NuGet packages for discovered solution
        shell: pwsh
        run: |
          $solutionPath = "${{ steps.find_and_prepare.outputs.solutionPath }}"
          if (-not $solutionPath) { Write-Error "No solution path discovered"; exit 1 }
          Write-Host "Restoring NuGet packages for solution: $solutionPath"
          nuget restore $solutionPath -NonInteractive
          if ($LASTEXITCODE -ne 0) { Write-Host "nuget restore returned exit code $LASTEXITCODE"; exit $LASTEXITCODE }

      - name: Verify restored packages (diagnostic)
        shell: pwsh
        run: |
          $solutionDir = "${{ steps.find_and_prepare.outputs.solutionDir }}"
          $packagesRoot = Join-Path $solutionDir "packages"
          Write-Host "Looking for packages under: $packagesRoot"
          if (Test-Path $packagesRoot) {
            Get-ChildItem -Path $packagesRoot -Directory -ErrorAction SilentlyContinue | Select-Object Name | Format-Table
          } else {
            Write-Host "No packages folder found at expected location. Listing $solutionDir contents:"
            Get-ChildItem -Path $solutionDir -Force | Select-Object Name,Mode | Format-Table
          }
          Write-Host "Check for Microsoft.XAudio2.Redist files:"
          Get-ChildItem -Path (Join-Path $packagesRoot "Microsoft.XAudio2.Redist*") -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table

      - name: Build solution with MSBuild
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { Write-Error "vswhere did not find Visual Studio with MSBuild."; exit 1 }
          $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) { Write-Error "MSBuild.exe not found at $msbuild"; exit 1 }

          $solutionPath = "${{ steps.find_and_prepare.outputs.solutionPath }}"
          if (-not (Test-Path $solutionPath)) {
            Write-Host "Solution not found at $solutionPath. Listing repo root for diagnosis:"
            Get-ChildItem -Force | Format-Table Name,Mode
            exit 1
          }

          $logFile = Join-Path $PWD "msbuild_tombengine.log"
          $args = @(
            "`"$solutionPath`"",
            "/t:Rebuild",
            "/p:Configuration=Release",
            "/m",
            "/v:minimal",
            "/clp:Summary",
            "/fl",
            "/flp:logfile=$logFile;verbosity=diagnostic"
          )

          Write-Host "Running MSBuild: $msbuild $($args -join ' ')"
          $proc = Start-Process -FilePath $msbuild -ArgumentList $args -Wait -NoNewWindow -PassThru
          $exitCode = $proc.ExitCode

          New-Item -ItemType Directory -Path build_logs -Force | Out-Null
          if (Test-Path $logFile) {
            Copy-Item -Path $logFile -Destination (Join-Path build_logs (Split-Path $logFile -Leaf)) -Force
            Write-Host "MSBuild log copied to build_logs"
          } else {
            Write-Host "MSBuild log not found at $logFile; creating placeholder log"
            New-Item -Path (Join-Path build_logs "msbuild_tombengine.log") -ItemType File -Force | Out-Null
          }

          if ($exitCode -ne 0) {
            Write-Host "MSBuild exited with code $exitCode"
            exit $exitCode
          }

      - name: Show potential outputs for debugging
        shell: pwsh
        run: |
          Write-Host "Listing Release and Build folders (may include net48/net6.0 subfolders):"
          Get-ChildItem -Path . -Recurse -Filter Release -Directory -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
          Get-ChildItem -Path . -Recurse -Filter Build -Directory -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table

      - name: Upload MSBuild logs
        uses: actions/upload-artifact@v4
        with:
          name: tombengine-msbuild-log-${{ github.run_id }}
          path: build_logs

      - name: Package Build or Release outputs
        shell: pwsh
        run: |
          $zipName = "tombengine_build_${{ github.run_id }}.zip"
          $buildCandidates = @()

          # Prefer a Build folder under the solution directory, then repo root Build, then any Release folders
          $slnDir = "${{ steps.find_and_prepare.outputs.solutionDir }}"
          $candidate1 = Join-Path $slnDir "Build"
          if (Test-Path $candidate1) { $buildCandidates += (Resolve-Path $candidate1).Path }

          if (Test-Path .\Build) { $buildCandidates += (Resolve-Path .\Build).Path }

          $releaseDirs = Get-ChildItem -Path . -Recurse -Filter Release -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if ($releaseDirs) { $buildCandidates += $releaseDirs }

          if ($buildCandidates.Count -gt 0) {
            Write-Host "Compressing: $($buildCandidates -join '; ')"
            Compress-Archive -Path $buildCandidates -DestinationPath $zipName -Force
          } else {
            Write-Host "No Build/Release outputs found; creating placeholder zip"
            New-Item -Path $zipName -ItemType File -Force | Out-Null
          }

          New-Item -ItemType Directory -Path build_artifacts -Force | Out-Null
          Move-Item -Path $zipName -Destination (Join-Path build_artifacts $zipName) -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tombengine-build-${{ github.run_id }}
          path: build_artifacts
